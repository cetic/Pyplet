[project]
name = "pyplet"
version = "0.0.1"
description = "Python everywhere!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3.0",
    "build~=1.2.0",
    "cython>=3.1.2",
    "htpy>=25.12.0",
    "httpx>=0.27.0",
    "markupsafe>=3.0.3",
    "pyodide-build>=0.30.5",
    "python-minifier>=2.11.3",
    "tornado>=6.5.1",
]

authors = [
  {name = "Maxime Istasse", email = "istassem@gmail.com"},
  {name = "Arthur Lorin", email = "arthur.lorin@cetic.be"},
  {name = "Erwan Henin", email = "erwan.henin@cetic.be"},
  {name = "Vincent Stragier", email = "vincent.stragier@cetic.be"},
]

license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "selenium>=4.16.0",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools]
include-package-data = true

[project.scripts]
pyplet = "pyplet.server.cli:script_main"

[tool.setuptools.package-data]
# Explicit patterns, never a recursive glob: the scaffold tree also holds
# build/test residue (__pycache__, .transpiled) that must not be shipped.
pyplet = [
    "apps/template/*.py",
    "apps/tutorial/*.py",
    "apps/tutorial/public/*",
    "apps/tutorial/static/*",
    "images/pyplet_logo_no_bg.svg",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyplet*"]
namespaces = false

[tool.black]
verbose = true
line-length = 79
target-version = ['py312', 'py313', 'py314']
include = '.pyi?$'
exclude = '''
/(
    .git
    | .hg
    | .mypy_cache
    | .tox
    | .venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
builtins = ["_"]
# cache-dir = "~/.cache/ruff"
exclude = [".venv", "**/build", "**/.transpiled"]
line-length = 79
fix = true
indent-width = 4
respect-gitignore = false
show-fixes = true
src = ["src"]
target-version = "py312"
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = 79
# Enable reformatting of code snippets in comments.
indent-style = "space"
line-ending = "lf"
