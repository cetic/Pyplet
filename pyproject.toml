[project]
name = "pyplet"
version = "0.0.1"
description = "Python everywhere!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3.0",
    "htpy>=25.12.0",
    "httpx>=0.27.0",
    "markupsafe>=3.0.3",
    "tornado>=6.5.1",
]

authors = [
  {name = "Maxime Istasse", email = "istassem@gmail.com"},
  {name = "Arthur Lorin", email = "arthur.lorin@cetic.be"},
  {name = "Erwan Henin", email = "erwan.henin@cetic.be"},
  {name = "Vincent Stragier", email = "vincent.stragier@cetic.be"},
]

license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "selenium>=4.16.0",
    "pytest-xdist>=3.8.0",
    # ruff vit dans l'extra `test` parce que les recettes du Makefile
    # résolvent le linter par `uv run --extra test`. Version exacte et non
    # `>=` : `uv.lock` n'est pas versionné, la CI résout donc à neuf, et la
    # révision de `ruff-pre-commit` doit rester égale à ce pin, sinon les
    # deux chaînes rendent deux verdicts. Voir #60.
    "ruff==0.16.6",
]

[tool.setuptools]
include-package-data = true

[project.scripts]
pyplet = "pyplet.server.cli:script_main"

[tool.setuptools.package-data]
# Explicit patterns, never a recursive glob: the scaffold tree also holds
# build/test residue (__pycache__, .transpiled) that must not be shipped.
pyplet = [
    "apps/template/*.py",
    "apps/tutorial/*.py",
    "apps/tutorial/public/*",
    "apps/tutorial/static/*",
    "images/pyplet_logo_no_bg.svg",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyplet*"]
namespaces = false

[tool.ruff]
builtins = ["_"]
# cache-dir = "~/.cache/ruff"
# `**/*.md` : depuis la 0.16, `ruff format` met en forme le Python des
# blocs Markdown. Ceux de ce dépôt portent des directives d'inclusion
# mkdocs (`--8<-- "…"`) que ruff lit comme du Python et réécrit en
# `--8 < --"…"` : 12 fichiers touchés, dont README.md, et la doc ne se
# construit plus. Les hooks passent `--force-exclude`, donc l'exclusion
# vaut pour les deux chaînes — c'est le comportement d'avant la 0.16.
exclude = [".venv", "**/build", "**/.transpiled", "**/*.md"]
line-length = 79
fix = true
indent-width = 4
respect-gitignore = false
show-fixes = true
# Le paquet est à la racine, il n'existe pas de répertoire `src/`. Avec
# `["src"]`, ruff classe `pyplet` en tiers et le range avec `tornado`, là
# où il est premier parti. Voir #58.
src = ["."]
target-version = "py312"
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = 79
# Enable reformatting of code snippets in comments.
indent-style = "space"
line-ending = "lf"
