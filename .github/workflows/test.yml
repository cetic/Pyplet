name: Test Suite

on:
  push:
    branches: [ main, dev ]

  pull_request:
    branches: [ main, dev ]

  workflow_call:

jobs:
  # Miroir du job `lint` de .gitlab-ci.yml : même commande, donc même verdict
  # que sur le poste de développement et que sur GitLab. Voir #60.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      # Every uv call, `uv run` included, must land on the matrix interpreter.
      # Without this, uv picks the runner's default 3.13 for the 3.12 and 3.14
      # legs (measured: run 34485596900, "Using CPython 3.13.15" on both), so
      # only one of the three versions was really tested. Same fix as in
      # .gitlab-ci.yml.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver
          chromedriver --version
          chromium --version

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest tests/ -v --cov=pyplet --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=40
        env:
          PYPLET_DEBUG: "1"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            htmlcov/
            .pytest_cache/
