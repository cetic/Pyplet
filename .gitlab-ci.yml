---
# GitLab pipeline — deliberate mirror of .github/workflows/test.yml and
# .github/workflows/prek.yml. Keep the two in step: the point of this file
# is that "the tests pass" means the same thing on both forges.
#
# Reference verdict to reproduce (GitHub run 33183032084 on dea1715):
#   280 passed on each of Python 3.12 / 3.13 / 3.14, total coverage 67.16%.
#
# Deliberate differences from GitHub, none of which change the verdict:
#   - No Codecov upload (decision: the coverage report stays inside CETIC).
#     GitLab renders it natively from the Cobertura artifact instead.
#   - --junitxml and --cov-report=html are added so GitLab can show failed
#     tests in the merge request and so the archived report is non-empty.
#   - The interpreter comes from uv rather than actions/setup-python, and the
#     browser from Debian rather than an Ubuntu snap.
# Package publication stays on GitHub: it relies on a GitHub-only identity.

stages:
  - lint
  - test

variables:
  # Debian-based, and already carries git + curl, which the runner needs to
  # clone before any before_script can install anything.
  BASE_IMAGE: python:3.13-bookworm
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.cache/uv-python
  UV_NO_PROGRESS: "1"
  GIT_DEPTH: "50"

# Same trigger surface as GitHub: pushes to main and dev, plus every merge
# request. A feature branch with no merge request gets no pipeline, exactly
# as on GitHub, and no branch pipeline duplicates a merge request pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
    - when: never

default:
  image: $BASE_IMAGE
  interruptible: true

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  variables:
    PYPLET_DEBUG: "1"
  cache:
    key:
      prefix: uv-$PYTHON_VERSION
      files:
        - pyproject.toml
    paths:
      - .cache/uv
      - .cache/uv-python
  before_script:
    # Browser for the Selenium suite. conftest.py pins
    # /usr/bin/chromium-browser whenever CI is set, which is the Ubuntu
    # package layout; Debian ships the same binary as /usr/bin/chromium, so
    # the symlink makes the environment match the suite rather than patching
    # the suite. chromium-driver keeps the driver at the browser's own
    # version, so Selenium Manager resolves it offline.
    - apt-get update
    - apt-get install -y --no-install-recommends chromium chromium-driver
    - ln -sf /usr/bin/chromium /usr/bin/chromium-browser
    - chromedriver --version
    - chromium-browser --version
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - uv venv --python "$PYTHON_VERSION"
    - uv sync --extra test --python "$PYTHON_VERSION"
    # Proves in the log which interpreter the matrix leg actually ran.
    - uv run python --version
  script:
    - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - >
      uv run pytest tests/ -v
      --cov=pyplet
      --cov-report=xml:coverage.xml
      --cov-report=html
      --cov-report=term
      --cov-fail-under=40
      --junitxml=report.xml
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - htmlcov/
      - coverage.xml
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

prek:
  stage: lint
  variables:
    # prek builds hook environments under the project so they survive in the
    # cache instead of being refetched on every run.
    PREK_HOME: $CI_PROJECT_DIR/.cache/prek
  cache:
    key:
      prefix: prek
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/prek
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - uv tool install prek
    - prek --version
  script:
    - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    # Same set of hooks as the GitHub action, and the same default stage, so
    # the pre-push-only pytest hook stays out of it here too.
    - prek run --all-files --show-diff-on-failure
